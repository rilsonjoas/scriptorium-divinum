# Bots de preview de link (WhatsApp, Facebook, Telegram, Twitter/X,
# Slack, Discord, LinkedIn) não rodam JS — o SEO client-side (useEffect)
# só atualiza as meta tags depois de montar no navegador, então esses
# bots sempre viam as tags genéricas do index.html em vez do livro
# específico (mesmo achado do biblia-na-arte, 2026-09-19 — ver
# hetzner-infra/PADRAO-DE-ENGENHARIA.md). Só essas requisições, por
# User-Agent, são desviadas pra rota /share/livros/:id da API.
map $http_user_agent $is_link_preview_bot {
    default 0;
    "~*facebookexternalhit|WhatsApp|Twitterbot|TelegramBot|Slackbot|LinkedInBot|Discordbot|SkypeUriPreview|vkShare|Pinterest" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS embutido do Docker — necessário porque o proxy_pass do bloco
    # /livros/ abaixo está dentro de um `if`, tratado como dinâmico
    # (resolvido a cada requisição), exigindo resolver explícito (achado
    # real no biblia-na-arte, 2026-09-19: sem isso, 502 sempre com "no
    # resolver defined to resolve <container>").
    resolver 127.0.0.11 valid=30s;

    # Security Headers (OWASP)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Imagens e capas — cache de 1 ano
    location /images/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Downloads (PDFs, EPUBs)
    location /downloads/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Assets gerados pelo Vite com hash no nome
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Sitemap dinâmico: encaminha requisições pro container da API
    location = /sitemap.xml {
        proxy_pass http://scriptorium-api:3001/sitemap.xml;
    }

    # Página de livro: bot de preview de link vai pra rota de share da
    # API; navegador de verdade cai na SPA normal, igual antes.
    location ~ ^/livros/(?<book_id>[^/]+)$ {
        if ($is_link_preview_bot) {
            proxy_pass http://scriptorium-api:3001/share/livros/$book_id;
            break;
        }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;
}
