name: Deploy VPS

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-vps
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - name: Deploy no VPS (git pull + rebuild)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Guarda de disco (INCIDENTES.md no infra, 2026-08-23): aborta
            # antes de piorar se a raiz estiver >=90%.
            USO=$(df --output=pcent / | tail -1 | tr -dc '0-9')
            if [ "$USO" -ge 90 ]; then
              echo "❌ Abortado: disco em ${USO}% (limite 90%). Rode: docker builder prune -af"
              exit 1
            fi
            cd /opt/scriptorium-divinum
            git pull --ff-only origin main
            cd ~/hetzner-infra
            make deploy service=scriptorium-divinum
            # Migrations do schema. NÃO rodavam no deploy: o `make deploy`
            # só sobe o container, e o migrator do drizzle precisa ser
            # chamado à mão. O efeito é o pior possível — silencioso.
            # Em 2026-09-26 a coluna `books.related_edition_slug` foi
            # criada em código e o deploy foi verde; a API continuou
            # devolvendo `relatedEditionSlug: null` porque o schema estava
            # atrás do código, e nada no pipeline acusou.
            # Se a migration falhar, o deploy falha. Schema atrás do código
            # é pior que deploy vermelho.
            if docker ps --format '{{.Names}}' | grep -qx 'scriptorium-api'; then
              docker exec scriptorium-api node dist/db/migrate.js
            else
              echo "⚠️ Container scriptorium-api não encontrado — migration NAO rodada."
              echo "   Rode no VPS: docker exec scriptorium-api node dist/db/migrate.js"
            fi
            # Prune total pós-deploy (INCIDENTES.md 2026-08-23): sem filtro de
            # tempo — filtros semanais não pegam rajadas; e o prune simples (-f)
            # deixa registros compartilhados no disco (17,9GB invisíveis).
            # Achado 2026-09-19: deploys de repos DIFERENTES no mesmo host não
            # são serializados (o `concurrency` do Actions é por repositório),
            # então dois prunes concorrentes fazem o daemon responder
            # "a prune operation is already running" — com `set -euo pipefail`
            # isso derrubava a job DEPOIS do deploy ter dado certo. Retry curto:
            # a disputa dura segundos. Se ainda falhar, segue mesmo assim — o
            # guard de disco (>=90%) do próximo deploy cobre acúmulo real.
            for CMD in "builder prune -af" "image prune -f"; do
              OK=0
              for i in $(seq 1 5); do
                if docker $CMD >/dev/null 2>&1; then OK=1; break; fi
                sleep 10
              done
              [ "$OK" -eq 1 ] || echo "⚠️  docker $CMD não concluiu em 5 tentativas"
            done
            USO=$(df --output=pcent / | tail -1 | tr -dc '0-9')
            echo "✅ Deploy ok — disco em ${USO}%"

      - name: Smoke test
        run: |
          # Achado 2026-08-16: "sleep 3" fixo dava falso-negativo (container
          # às vezes ainda reiniciando) mesmo com o deploy tendo funcionado.
          # Retry de verdade: até 10 tentativas, 3s entre elas.
          for url in https://scriptorium.narniano.com/ https://api-scriptorium.narniano.com/health; do
            for i in $(seq 1 10); do
              curl -sf -o /dev/null "$url" && break
              [ "$i" -eq 10 ] && exit 1
              sleep 3
            done
          done
